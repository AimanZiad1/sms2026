workflows:
  android-workflow:
    name: Build Android Companion APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    working_directory: flutter_app
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build Release APK
        script: flutter build apk --release
    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/*.apk

  windows-workflow:
    name: Build Windows Desktop EXE
    max_build_duration: 30
    instance_type: windows_x2
    working_directory: flutter_app
    environment:
      flutter: stable
    scripts:
      - name: Enable Windows Desktop Support
        script: flutter config --enable-windows-desktop
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build Windows Release EXE
        script: flutter build windows --release
    artifacts:
      - flutter_app/build/windows/x64/runner/Release/**
